name: Build Junba AI Transcriber v3.8.1 FULL + Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.spec'
      - 'requirements.txt'
      - 'hooks/**'
      - 'packaging/**'
      - 'android/**'
      - '.github/workflows/build-windows-v3.8.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: junba-ai-transcriber-v381-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-windows:
    name: Validate Windows v3.8.1 source
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Fast syntax preflight
        shell: pwsh
        run: |
          python -m compileall -q main.py app
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax preflight failed' }
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip check
      - name: Tests and UI self-test
        shell: pwsh
        run: |
          pytest -q tests
          $env:QT_QPA_PLATFORM = 'offscreen'
          python main.py --ui-self-test "$pwd/UI_SELFTEST_SOURCE.txt"
          if (-not (Select-String -Path "$pwd/UI_SELFTEST_SOURCE.txt" -Pattern 'UI_SELFTEST_OK' -Quiet)) { throw 'Source UI self-test failed' }

  portable:
    name: Build Portable x64
    needs: validate-windows
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build Portable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_portable.spec
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8_Portable/Junba_AI_Transcriber_v3.8.exe"
          if (!(Test-Path $exe)) { throw 'Portable EXE not found' }
      - name: Portable self-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8_Portable/Junba_AI_Transcriber_v3.8.exe"
          foreach ($args in @(
            @('--windowed-io-self-test', "$pwd/release/WINDOWED_IO_PORTABLE.txt"),
            @('--self-test', "$pwd/release/SELFTEST_PORTABLE.txt"),
            @('--ui-self-test', "$pwd/release/UI_SELFTEST_PORTABLE.txt")
          )) {
            $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable self-test failed: $($args[0])" }
          }
      - name: Package Portable
        shell: pwsh
        run: |
          $zip = "$pwd/release/Junba_AI_Transcriber_v3.8.1_FULL_Portable_Windows_x64.zip"
          Compress-Archive -Path "$pwd/dist/Junba_AI_Transcriber_v3.8_Portable/*" -DestinationPath $zip -Force
          "ZIP  $((Get-FileHash $zip -Algorithm SHA256).Hash)  $([IO.Path]::GetFileName($zip))" | Set-Content "$pwd/release/SHA256SUMS_PORTABLE.txt" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-AI-Transcriber-v3.8.1-FULL-Portable-Windows-x64
          path: |
            release/Junba_AI_Transcriber_v3.8.1_FULL_Portable_Windows_x64.zip
            release/SHA256SUMS_PORTABLE.txt
            release/SELFTEST_PORTABLE.txt
            release/UI_SELFTEST_PORTABLE.txt
            release/WINDOWED_IO_PORTABLE.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Junba_AI_Transcriber_v3.8.1_FULL_Portable_Windows_x64.zip

  single-exe:
    name: Build Single EXE x64
    needs: validate-windows
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Build Single EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean JunbaAITranscriber_onefile.spec
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8.exe"
          if (!(Test-Path $exe)) { throw 'Single EXE not found' }
      - name: Single EXE self-tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = "$pwd/dist/Junba_AI_Transcriber_v3.8.exe"
          foreach ($args in @(
            @('--windowed-io-self-test', "$pwd/release/WINDOWED_IO_SINGLE.txt"),
            @('--self-test', "$pwd/release/SELFTEST_SINGLE.txt"),
            @('--ui-self-test', "$pwd/release/UI_SELFTEST_SINGLE.txt")
          )) {
            $p = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Single EXE self-test failed: $($args[0])" }
          }
      - name: Package Single EXE
        shell: pwsh
        run: |
          Copy-Item "$pwd/dist/Junba_AI_Transcriber_v3.8.exe" "$pwd/release/Junba_AI_Transcriber_v3.8.1_FULL_Single_EXE_Windows_x64.exe" -Force
          $exe = "$pwd/release/Junba_AI_Transcriber_v3.8.1_FULL_Single_EXE_Windows_x64.exe"
          "EXE  $((Get-FileHash $exe -Algorithm SHA256).Hash)  $([IO.Path]::GetFileName($exe))" | Set-Content "$pwd/release/SHA256SUMS_SINGLE.txt" -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-AI-Transcriber-v3.8.1-FULL-Single-EXE-Windows-x64
          path: |
            release/Junba_AI_Transcriber_v3.8.1_FULL_Single_EXE_Windows_x64.exe
            release/SHA256SUMS_SINGLE.txt
            release/SELFTEST_SINGLE.txt
            release/UI_SELFTEST_SINGLE.txt
            release/WINDOWED_IO_SINGLE.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Junba_AI_Transcriber_v3.8.1_FULL_Single_EXE_Windows_x64.exe

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate or bootstrap Android sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for p in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && [ -d "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            rm -rf /tmp/android-cli && mkdir -p /tmp/android-cli
            unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cli
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/android-cli/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Android source preflight
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/tw/junba/transcriber/MainActivity.java
          test -f android/app/build.gradle.kts
          grep -q 'setFixedLengthStreamingMode' android/app/src/main/java/tw/junba/transcriber/MainActivity.java
      - name: Compile Android Java
        shell: bash
        run: gradle -p android :app:compileDebugJavaWithJavac --no-daemon --stacktrace
      - name: Build APK
        shell: bash
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Package APK
        shell: bash
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk
          sha256sum release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk > release/SHA256SUMS_ANDROID.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Junba-AI-Transcriber-v3.8.1-Android-APK
          path: |
            release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk
            release/SHA256SUMS_ANDROID.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/Junba_AI_Transcriber_v3.8.1_Android_Gemini.apk
